name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  quick-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Verilator
        run: sudo apt-get update -q && sudo apt-get install -y -q verilator g++ make && verilator --version
      - name: Cache Verilator builds
        uses: actions/cache@v4
        with:
          path: /tmp/omega_build
          key: vbuild-${{ hashFiles('rtl/**', 'tb/**') }}
      - name: Quick regression
        env:
          PYTHONUNBUFFERED: "1"
        run: bash tests/ci_quick.sh
